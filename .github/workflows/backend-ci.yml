
# Workflow'un GitHub Actions ekranındaki adı.
name: Backend CI

# main'e push ve main hedefli PR işlemlerinde çalışır.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Varsayılan token yetkilerini sınırlar.
permissions:
  contents: read

jobs:
  test:
    name: Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      # Repository kaynak kodlarını indirir.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 25 kurulumu ve Maven dependency cache.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Maven Wrapper'a çalıştırma izni verir.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # Testleri çalıştırır ve projeyi doğrular.
      - name: Build and test
        run: ./mvnw -B verify
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'

  publish:
    name: Docker Build & Publish
    needs: test
    runs-on: ubuntu-latest

    # PR işlemlerinde image yayınlanmaz.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      # Kaynak kodlarını indirir.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker Buildx ortamını hazırlar.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registry'ye giriş yapar.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image için latest ve commit bazlı etiketler oluşturur.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/durdus06/ticketing-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Docker image oluşturur ve GHCR'ye gönderir.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
