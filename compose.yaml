services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=ticketing'
      - 'POSTGRES_USER=ticketing'
      - 'POSTGRES_PASSWORD=ticketing'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketing -d ticketing']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
